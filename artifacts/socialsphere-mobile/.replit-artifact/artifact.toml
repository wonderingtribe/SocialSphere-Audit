kind = "mobile"
previewPath = "/"
title = "SocialSphere AI Mobile"
description = "A mobile companion for SocialSphere AI, an approval-first social CRM and lead engine that helps businesses monitor legitimate social interactions, qualify leads, review AI-suggested responses, and track conversions without fabricating connected data or bypassing platform rules."
version = "1.0.0"
id = "artifacts/socialsphere-mobile"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20449

[services.development]
run = "pnpm --filter @workspace/socialsphere-mobile run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/socialsphere-mobile", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/socialsphere-mobile", "run", "serve" ]

[services.env]
PORT = "20449"
BASE_PATH = "/"
